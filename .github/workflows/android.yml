name: Android Release

on:
  # ── Manual trigger from the GitHub Actions UI ──────────────────────────────
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0). Leave blank to use the one in build.gradle.'
        required: false
        default: ''

  # ── CI smoke-test on every push / PR to main (no release created) ──────────
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Allow the job to create GitHub Releases and upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Source ──────────────────────────────────────────────────────────────
      # SECURITY: Pinned to a full commit SHA to prevent supply-chain attacks
      # via mutable tags (e.g. trivy-action compromise).
      # actions/checkout v4.2.2 — verify at https://github.com/actions/checkout/releases/tag/v4.2.2
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0   # full history needed for --generate-notes

      # ── Java ────────────────────────────────────────────────────────────────
      # actions/setup-java v4.7.0 — verify at https://github.com/actions/setup-java/releases/tag/v4.7.0
      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── Optional: override versionName from workflow input ──────────────────
      - name: Override versionName (if provided)
        if: ${{ github.event.inputs.version_name != '' }}
        run: |
          sed -i 's/versionName = "[^"]*"/versionName = "${{ github.event.inputs.version_name }}"/' app/build.gradle.kts
          echo "versionName overridden to ${{ github.event.inputs.version_name }}"

      # ── Gradle permissions ──────────────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Decode signing keystore from GitHub Secret ──────────────────────────
      # The secret KEYSTORE_BASE64 holds the base64-encoded .keystore file.
      # If the secret is absent (e.g. fork PRs), this step is skipped and
      # Gradle produces an unsigned APK (storeFile = null in build.gradle.kts).
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "✅ Keystore decoded."

      # ── Build release APK (R8 + signing) ────────────────────────────────────
      # assembleRelease = production mode (R8 minification + resource shrinking + signing).
      # Signing credentials come from environment variables read in build.gradle.kts.
      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # ── Resolve the versioned filename ──────────────────────────────────────
      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      # ── Rename APK to no-thanks-v{VERSION}.apk ─────────────────────────────
      # Find whichever APK Gradle produced (signed → app-release.apk,
      # unsigned → app-release-unsigned.apk) and give it the versioned name.
      - name: Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
          echo "Found APK: $APK_PATH"
          mv "$APK_PATH" \
             "app/build/outputs/apk/release/no-thanks-v${{ steps.version.outputs.version }}.apk"

      # ── Upload workflow artifact ─────────────────────────────────────────────
      # actions/upload-artifact v4.6.2 — verify at https://github.com/actions/upload-artifact/releases/tag/v4.6.2
      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: no-thanks-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/no-thanks-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      # ── Create GitHub Release and attach APK (manual dispatch only) ─────────
      # Uses the pre-installed `gh` CLI — no extra action needed (no SHA pinning required).
      # --generate-notes auto-writes release notes from PRs/commits since the last tag.
      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK="app/build/outputs/apk/release/no-thanks-v${VERSION}.apk"

          gh release create "v${VERSION}" \
            --title "No, thanks! v${VERSION}" \
            --generate-notes \
            --latest \
            "${APK}#No, thanks! v${VERSION} — Android APK"

          echo "✅ GitHub Release v${VERSION} created with APK attached."
